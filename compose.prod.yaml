services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-officecook}
      POSTGRES_USER: ${POSTGRES_USER:-officecook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    image: ${BACKEND_IMAGE:-officecooking-backend:local}
    build:
      context: ./backend
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    restart: unless-stopped
    environment:
      OFFICE_COOK_ENVIRONMENT: production
      OFFICE_COOK_DATABASE_HOST: postgres
      OFFICE_COOK_DATABASE_NAME: ${POSTGRES_DB:-officecook}
      OFFICE_COOK_DATABASE_USER: ${POSTGRES_USER:-officecook}
      OFFICE_COOK_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      OFFICE_COOK_ALLOWED_HOSTS: "[\"${APP_DOMAIN}\",\"localhost\"]"
      OFFICE_COOK_CORS_ORIGINS: "[\"${APP_ORIGIN:?set APP_ORIGIN in .env}\"]"
      OFFICE_COOK_SESSION_COOKIE_SECURE: "true"
      # Empty is allowed: production then derives the key from POSTGRES_PASSWORD (see DEPLOYMENT.md),
      # which is how tokens already stored on the VDS were encrypted.
      OFFICE_COOK_ZENMONEY_ENCRYPTION_KEY: ${OFFICE_COOK_ZENMONEY_ENCRYPTION_KEY:-}
      OFFICE_COOK_ZENMONEY_SYNC_INTERVAL_MINUTES: ${OFFICE_COOK_ZENMONEY_SYNC_INTERVAL_MINUTES:-15}
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
  frontend:
    image: ${FRONTEND_IMAGE:-officecooking-frontend:local}
    build:
      context: ./frontend
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
    networks:
      default:
        aliases: [officecooking-frontend]
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env}
      APP_HTTPS_PORT: ${APP_HTTPS_PORT:-443}
    ports:
      - "80:80"
      - "${APP_HTTPS_PORT:-443}:${APP_HTTPS_PORT:-443}"
      - "${APP_HTTPS_PORT:-443}:${APP_HTTPS_PORT:-443}/udp"
      # Development stands of other tenants (CashFlow, zerno).
      - "8444:8444"
      - "8444:8444/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [frontend]
    # This Caddy is the shared ingress of the VDS. Every tenant's <name>-ingress network MUST be
    # listed here and under top-level `networks`: Compose recreates caddy on every release, and a
    # network attached only by hand (`docker network connect`) is dropped, which turns that tenant
    # into 502. scripts/deploy-production.sh refuses to deploy if an *-ingress network exists on the
    # host but is missing here.
    networks:
      default: {}
      cashflow-ingress: {}
      zerno-ingress: {}
      taskradar-ingress: {}
      familyapp-ingress: {}
volumes:
  postgres-data:
  caddy-data:
  caddy-config:
networks:
  # Created by each tenant's own deployment; OfficeCooking only joins them.
  cashflow-ingress:
    external: true
  zerno-ingress:
    external: true
  taskradar-ingress:
    external: true
  familyapp-ingress:
    external: true
