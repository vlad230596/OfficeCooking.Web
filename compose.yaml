services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-officecook}
      POSTGRES_USER: ${POSTGRES_USER:-officecook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env and set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      OFFICE_COOK_ENVIRONMENT: local
      OFFICE_COOK_DATABASE_HOST: postgres
      OFFICE_COOK_DATABASE_PORT: 5432
      OFFICE_COOK_DATABASE_NAME: ${POSTGRES_DB:-officecook}
      OFFICE_COOK_DATABASE_USER: ${POSTGRES_USER:-officecook}
      OFFICE_COOK_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      OFFICE_COOK_ALLOWED_HOSTS: '["localhost","127.0.0.1"]'
      OFFICE_COOK_CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
      OFFICE_COOK_ZENMONEY_ENCRYPTION_KEY: ${OFFICE_COOK_ZENMONEY_ENCRYPTION_KEY:-}
      OFFICE_COOK_ZENMONEY_SYNC_INTERVAL_MINUTES: ${OFFICE_COOK_ZENMONEY_SYNC_INTERVAL_MINUTES:-15}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
